name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom (used by the Vitest suite) requires Node ^22.22.2 ||
          # ^24.15.0 || >=26.0.0 -- Node 20 actually crashes every test
          # with "webidl.util.markAsUncloneable is not a function" (a
          # missing internal API jsdom's bundled undici depends on), it
          # doesn't just warn. Confirmed by running this workflow.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend

      - name: Build
        run: npm run build
